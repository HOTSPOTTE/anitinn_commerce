services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anitinn
      POSTGRES_USER: anitinn
      POSTGRES_PASSWORD: anitinn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anitinn -d anitinn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
